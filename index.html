async function callProxy(messages,maxTokens){
  /* Agent IA partagé : la clé Gemini reste côté serveur (fonction Netlify), jamais dans la page */
  const res=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,maxTokens})});
  if(res.status===404)throw new Error('NO_KEY');
  const t=await res.text();let j={};try{j=JSON.parse(t)}catch(e){}
  if(!res.ok)throw new Error('HTTP '+res.status+' '+(j.error||t.slice(0,150)));
  if(!j.text)throw new Error('EMPTY');
  return String(j.text).trim();
}
async function callAI(messages,maxTokens){
  if(!AI.enabled())return callProxy(messages,maxTokens);
  if(AI.provider==='gemini')return callGemini(messages,maxTokens);
  return callOpenAI(messages,maxTokens);
}
async function callGemini(messages,maxTokens){
  const models=[AI.model||'gemini-3.8-flash','gemini-3.8-flash','gemini-3.6-flash','gemini-2.5-flash'];
  const uniq=[...new Set(models)];
  let system='';const contents=[];
  for(const m of messages){
    if(m.role==='system'){system+=(system?'\n':'')+m.content;continue}
    const role=m.role==='assistant'?'model':'user';
    if(contents.length&&contents[contents.length-1].role===role){contents[contents.length-1].parts[0].text+='\n'+m.content}
    else contents.push({role,parts:[{text:m.content}]});
  }
  if(!contents.length)contents.push({role:'user',parts:[{text:'Bonjour'}]});
  const body={contents,generationConfig:{maxOutputTokens:maxTokens||2048,temperature:0.75}};
  if(system)body.systemInstruction={parts:[{text:system}]};
  let lastErr='';
  for(const model of uniq){
    try{
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':AI.apiKey},body:JSON.stringify(body)});
      const t=await res.text();
      if(!res.ok){let detail=t.slice(0,200);try{const j=JSON.parse(t);detail=(j.error&&(j.error.message||j.error.status))||detail}catch(x){}lastErr='HTTP '+res.status+' '+detail+' (modèle '+model+')';continue}
      const data=JSON.parse(t);
      const text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts.map(p=>p.text||'').join('');
      if(!text){lastErr='EMPTY ('+model+')';continue}
      return text.trim();
    }catch(e){lastErr=e.message||String(e)}
  }
  throw new Error(lastErr||'Gemini indisponible');
}
async function callOpenAI(messages,maxTokens){
  const base=(AI.baseURL||'https://api.openai.com/v1').replace(/\/$/,'');
  const res=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI.apiKey},body:JSON.stringify({model:AI.model||'gpt-4o-mini',messages,max_tokens:maxTokens||2048,temperature:0.75})});
  if(!res.ok){const t=await res.text().catch(()=>'');throw new Error('HTTP '+res.status+' '+t.slice(0,120))}
  const data=await res.json();
  const text=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
  if(!text)throw new Error('EMPTY');
  return text.trim();
}

function chip(d){return `<button class="chip ${S.targets.includes(d)?'on':''}" onclick="tg('${d.replace(/'/g,"\\'")}')">${esc(d)}</button>`}
function tg(d){const k=document.querySelector('main');const y=[$('#o_d')?.value,$('#o_p')?.value,$('#o_r')?.value,$('#o_h')?.value];
 S.targets=S.targets.includes(d)?S.targets.filter(x=>x!=d):[...S.targets,d];tmp=y;$('#app').innerHTML=onboard();
 if($('#o_d')){$('#o_d').value=y[0];$('#o_p').value=y[1];$('#o_r').value=y[2];$('#o_h').value=y[3]}}
let tmp;
function gd(g){const y=[$('#o_d')?.value,$('#o_p')?.value,$('#o_r')?.value,$('#o_h')?.value];S.gender=g;$('#app').innerHTML=onboard();$('#o_d').value=y[0];$('#o_p').value=y[1];$('#o_r').value=y[2];$('#o_h').value=y[3]}
function finish(){if(!S.tz){alert(tr('Choisis ton pays.'));return}if(!S.gender){alert(tr('Choisis ton personnage.'));return}if(!S.targets.length){alert(tr('Choisis au moins un point.'));return}
 S.start=$('#o_d').value||realToday();S.t0=S.start==realToday()?wall().ms:Date.parse(S.start+'T00:00:00Z');S.problem=$('#o_p').value;S.resolution=$('#o_r').value;S.hour=$('#o_h').value||'08:00';save();askNotif();tab='home';render({top:1});scrollTo(0,0)}

function tr(s){
 if(S.lang!=='es'||!s)return s;
 // Primero buscar la frase completa: evita perder la traducción cuando termina en punto, dos puntos o signos.
 if(Object.prototype.hasOwnProperty.call(D,s))return D[s];
 const m=s.match(/^([^\p{L}\p{N}]*)([\s\S]*?)([^\p{L}\p{N}?!.…)»]*)$/u);
 if(!m||!m[2])return s;
 const c=m[2];let r;
 if(Object.prototype.hasOwnProperty.call(D,c))r=D[c];
 if(r===undefined&&Object.prototype.hasOwnProperty.call(D,c+m[3]))r=D[c+m[3]];
 if(r===undefined){for(const [re,f] of R){const x=c.match(re);if(x){r=f(x);break}}}
 return r===undefined?s:m[1]+r+m[3];
}

function recoveryTasks(dep,day){
 const focusList=RECOVERY_FOCI[dep]||RECOVERY_FOCI.__generic;
 const f=focusList[Math.min(27,Math.max(0,day))];
 if(dep==='Cocaïne') return [
  `Note l’heure, le lieu et l’émotion associés à ${f}. Évalue l’envie de 0 à 10, sans te juger.`,
  `Choisis une barrière concrète pour aujourd’hui : évite un lieu à risque, bloque un contact déclencheur ou prévois un trajet différent.`,
  `Prépare une réponse à l’envie : éloigne-toi de la situation, attends 10 minutes, respire lentement et fais une activité prévue à l’avance.`,
  `Envoie un message à une personne sûre ou repère un service spécialisé pour parler de ${f}. Demander de l’aide est une action, pas un échec.`,
  `Écris un plan « si… alors… » lié à ${f}, puis choisis une petite récompense saine pour l’effort fourni aujourd’hui.`
 ];
 if(dep==='Kétamine') return [
  `Observe comment ${f} se manifeste chez toi. Note ce que tu ressens et ce dont tu aurais besoin à la place, sans te blâmer.`,
  `Rends ton environnement plus sûr : évite les contextes liés à la kétamine et prévois un lieu calme avec une personne de confiance si tu te sens vulnérable.`,
  `Pratique un exercice d’ancrage de 3 minutes : nomme 5 choses visibles, 4 sensations de contact et 3 sons autour de toi.`,
  `Planifie un contact avec un professionnel ou un service d’addictologie pour discuter de ${f}. En cas de douleur urinaire, envies fréquentes ou sang dans les urines, demande rapidement un avis médical.`,
  `Écris « si ${f} arrive, alors je… » avec une action de sécurité et une personne à contacter. Note ensuite ce qui t’a aidé aujourd’hui.`
 ];
 const d=dep.toLowerCase();
 return [
  `Observe ${f} dans ton rapport à ${d}. Note le déclencheur et l’intensité de l’envie de 0 à 10.`,
  `Choisis un changement concret dans ton environnement pour rendre la consommation ou l’habitude moins accessible aujourd’hui.`,
  `Teste une stratégie de remplacement pendant 10 minutes : marche, respiration lente, douche, musique ou activité manuelle.`,
  `Contacte une personne de confiance ou cherche un service d’aide adapté à ${d}. Écris ce que tu aimerais pouvoir lui dire.`,
  `Prépare un plan « si… alors… » pour ${f}, puis reconnais l’effort accompli, même si la journée n’a pas été parfaite.`
 ];
}

function steps(){
 const t=today(),day=Math.min(27,days()),dayNo=day+1;
 const blk=(ti,l,key)=>{
  const done=l.every((_,i)=>S.steps&&S.steps[t+'|'+key+i]);
  return `<div class="card"><h2>${esc(ti)}${done?' <span class="badge">✓</span>':''}</h2>${l.map((x,i)=>{const k=key+i,d=S.steps&&S.steps[t+'|'+k];return `<label class="msg ${d?'done-anim step-done':''}" style="display:flex;gap:10px;align-items:flex-start;margin:7px 0"><input type="checkbox" style="width:auto;margin:3px 0 0;accent-color:var(--ac);flex:none" ${d?'checked':''} onchange="stp('${k}',this.checked,'${key}',${l.length},'${esc(ti)}')"><span>${esc(key.startsWith("r")?taskText(S.targets[Number((key.match(/^r(\d+)_/)||[])[1])],day,i,x):tr(x))}</span></label>`}).join('')}</div>`;
 };
 const planTargets=S.targets.map((dep,j)=>blk(`${tr(dep)} · ${tr('Jour')} ${dayNo}/28`,recoveryTasks(dep,day),`r${j}_d${day}_`)).join('');
 const doneCount=S.targets.reduce((sum,dep,j)=>sum+recoveryTasks(dep,day).filter((_,i)=>S.steps&&S.steps[t+'|r'+j+'_d'+day+'_'+i]).length,0);
 const total=S.targets.length*5;
 return `<h1>🪜 ${tr('Mon parcours')}</h1>
 <div class="card"><h2>🌊 ${tr('28 jours, un pas après l’autre')}</h2><p>${tr('Jour')} <b>${dayNo}/28</b> · ${esc(S.targets.map(tr).join(', '))}</p><div style="height:8px;border-radius:99px;background:var(--gl);overflow:hidden;margin:10px 0"><div style="height:100%;width:${total?Math.round(doneCount/total*100):0}%;background:var(--ac);border-radius:99px"></div></div><p class="mu">${doneCount}/${total} ${tr('actions validées aujourd’hui. Les tâches de cocaïne et de kétamine sont distinctes. Après 28 jours, le parcours propose la phase de maintien du jour 28.')}</p></div>
 ${planTargets}
 ${blk(tr('Pour tous · prendre soin de soi'),[tr('Bois de l’eau régulièrement et prends un repas si tu en as besoin.'),tr('Fais 5 minutes de respiration lente ou d’ancrage.'),tr('Bouge doucement pendant 10 minutes si ton état le permet.'),tr('Écris une chose que tu as faite aujourd’hui malgré la difficulté.'),tr('Prépare une heure de coucher réaliste et une activité calme.')],'univ_')}
 <div class="card"><h2>📚 ${tr('Sur quoi s’appuie ce parcours ?')}</h2><p class="mu">${tr('Les actions s’inspirent de méthodes de soutien étudiées : stratégies cognitivo-comportementales et prévention de rechute, repérage des déclencheurs, renforcement positif et accompagnement social. Pour les stimulants comme la cocaïne, le renforcement positif et les thérapies comportementales sont des approches documentées. Pour la kétamine, un accompagnement professionnel est particulièrement utile et les symptômes urinaires doivent être évalués médicalement.')}</p><p><a href="https://www.samhsa.gov/resource/ebp/treatment-stimulant-use-disorders" target="_blank" rel="noopener" style="color:var(--ac)">SAMHSA · traitement des troubles liés aux stimulants</a></p><p><a href="https://leaflets.ekhuft.nhs.uk/ketamine-addiction-and-ketamine-bladder-and-induced-cystitis/html/" target="_blank" rel="noopener" style="color:var(--ac)">NHS · kétamine, vessie et soutien médical</a></p></div>
 <p class="mu">${tr('Ces exercices ne remplacent pas un accompagnement médical ou psychologique. Si tu as des symptômes physiques inquiétants, contacte un professionnel de santé.')}</p>`;
}
function stp(k,c,prefix,total,title){
 S.steps=S.steps||{};const key=today()+'|'+k;const was=!!S.steps[key];
 if(c&&!was){S.pts+=3;floatPts('+3 pts')}
 if(!c&&was)S.pts=Math.max(0,S.pts-3);
 S.steps[key]=c;save();
 if(c&&prefix&&total){let n=0;for(let i=0;i<total;i++)if(S.steps[today()+'|'+prefix+i])n++;
  if(n===total){const note=(S.notes&&S.notes[today()])||'';showCongrats(note,title||'Étape accomplie');}}
 render();
}
function floatPts(txt){const el=document.createElement('div');el.className='pts-float';el.textContent=txt;

 document.body.appendChild(el);setTimeout(()=>el.remove(),1200)}

<div class="card"><h2>Mon engagement</h2><label class="mu">Résolution</label><textarea onchange="S.resolution=this.value;save()">${esc(S.resolution)}</textarea><label class="mu">Date de départ</label><input type="date" value="${S.start}" max="${today()}" onchange="S.start=this.value;S.t0=S.start==realToday()?wall().ms:Date.parse(S.start+'T00:00:00Z');save()"><button onclick="resetApp()" style="${rst?'background:#d33;color:#fff;border-color:transparent':''}">${rst?'Confirmer : tout effacer':'Réinitialiser l’app'}</button></div>`}
async function askNotif(m){try{if(!('Notification' in window)){if(m)alert(tr('Notifications non disponibles ici.'));return}const r=await Notification.requestPermission();if(m)alert(tr(r=='granted'?'Notifications activées.':'Notifications refusées.'))}catch(e){if(m)alert(tr('Notifications non disponibles ici.'))}}
let lastN='';setInterval(()=>{if(!S.start)return;const hm=wall().hm,k=today()+hm;if(hm==S.hour&&lastN!=k){lastN=k;const t='Ma résolution : '+(S.resolution||'Je tiens bon aujourd’hui.');const b=$('#ban');b.textContent='🔔 '+t+' — Engagement maintenu aujourd’hui ?';b.style.display='block';b.onclick=()=>{b.style.display='none';tab='suivi';render()};try{if(Notification.permission=='granted')new Notification('Cap',{body:tr(t)})}catch(e){}}},20000);

const PLAN=[["Le plus dur est fait : tu as décidé. Aujourd’hui, ne cherche pas à tout changer, seulement à tenir jusqu’à ce soir.", "Lo más difícil ya está hecho: has decidido. Hoy no intentes cambiarlo todo, solo aguantar hasta esta noche.", "Écris sur un papier les 3 raisons qui t’ont poussé(e) à t’engager et garde-le près de toi.", "Escribe en un papel las 3 razones que te han llevado a comprometerte y guárdalo cerca de ti."], ["Ton corps se réajuste : fatigue, irritabilité et sommeil agité sont fréquents au début. Ce n’est pas un échec, c’est une phase.", "Tu cuerpo se reajusta: cansancio, irritabilidad y sueño agitado son habituales al principio. No es un fracaso, es una fase.", "Bois au moins 6 verres d’eau aujourd’hui et prends un vrai repas à heure fixe.", "Bebe al menos 6 vasos de agua hoy y haz una comida de verdad a una hora fija."], ["Identifie tes moments à risque (heure, lieu, émotion) : les connaître, c’est déjà les désamorcer à moitié.", "Identifica tus momentos de riesgo (hora, lugar, emoción): conocerlos ya es desactivarlos a medias.", "Note dans ton cahier les 3 situations où l’envie est la plus forte.", "Anota en tu cuaderno las 3 situaciones en las que las ganas son más fuertes."], ["Une envie dure rarement plus de 20 minutes. Retarde ta réaction : elle montera, puis retombera.", "Las ganas rara vez duran más de 20 minutos. Retrasa tu reacción: subirán y luego bajarán.", "À la prochaine envie, lance un minuteur de 20 minutes et occupe tes mains (cuisine, rangement, dessin).", "En la próxima gana, pon un temporizador de 20 minutos y ocupa las manos (cocinar, ordenar, dibujar)."], ["Dormir est un traitement : un sommeil régulier apaise l’anxiété et diminue les envies.", "Dormir es un tratamiento: un sueño regular calma la ansiedad y reduce las ganas.", "Éteins les écrans 30 minutes avant de dormir et couche-toi à une heure raisonnable.", "Apaga las pantallas 30 minutos antes de dormir y acuéstate a una hora razonable."], ["Ton environnement pèse plus que ta volonté. Rends la consommation difficile et le bien-être facile.", "Tu entorno pesa más que tu fuerza de voluntad. Haz difícil el consumo y fácil el bienestar.", "Retire de chez toi un objet, un contact ou une application liés à ta consommation.", "Retira de tu casa un objeto, un contacto o una aplicación ligados a tu consumo."], ["Une semaine ! Célèbre sans te récompenser avec ce que tu veux éviter, et mesure ce qui a déjà changé.", "¡Una semana! Celébralo sin premiarte con aquello que quieres evitar, y mide lo que ya ha cambiado.", "Offre-toi une récompense saine (film, bon repas, balade) et relis ta résolution à voix haute.", "Regálate un premio sano (película, buena comida, paseo) y lee tu resolución en voz alta."], ["Derrière chaque envie se cache souvent un besoin : s’apaiser, s’évader, ne plus se sentir seul(e). Demande-toi lequel.", "Detrás de cada gana suele esconderse una necesidad: calmarse, evadirse, no sentirse solo/a. Pregúntate cuál.", "À la prochaine envie, écris « J’ai besoin de… » et trouve une autre façon d’y répondre.", "En la próxima gana, escribe «Necesito…» y busca otra forma de responder a esa necesidad."], ["Respirer lentement active le calme du corps. Allonge ton expiration pour apaiser le stress.", "Respirar despacio activa la calma del cuerpo. Alarga la exhalación para aliviar el estrés.", "Fais 5 minutes de respiration 4-6 : inspire 4 secondes, expire 6 secondes.", "Haz 5 minutos de respiración 4-6: inhala 4 segundos, exhala 6 segundos."], ["Bouger libère des endorphines, tes alliées naturelles. Inutile de viser l’intensité : marcher compte.", "Moverte libera endorfinas, tus aliadas naturales. No hace falta buscar intensidad: caminar cuenta.", "Marche 30 minutes dehors, de préférence à l’heure où tu consommais d’habitude.", "Camina 30 minutos al aire libre, preferiblemente a la hora en que solías consumir."], ["Nommer une émotion en diminue l’intensité. Cherche le mot juste : tristesse, colère, honte, ennui…", "Nombrar una emoción reduce su intensidad. Busca la palabra justa: tristeza, rabia, vergüenza, aburrimiento…", "Trois fois dans la journée, note l’émotion du moment et son intensité de 1 à 10.", "Tres veces durante el día, anota la emoción del momento y su intensidad del 1 al 10."], ["Tu n’as pas à traverser cela seul(e). Parler à une personne de confiance allège déjà le poids.", "No tienes que atravesar esto solo/a. Hablar con una persona de confianza ya aligera la carga.", "Contacte une personne de confiance et dis-lui simplement comment tu vas, vraiment.", "Contacta con una persona de confianza y cuéntale simplemente cómo estás, de verdad."], ["L’ennui est un grand déclencheur. Prévoir ton temps libre, c’est lui retirer son pouvoir.", "El aburrimiento es un gran desencadenante. Planificar tu tiempo libre le quita poder.", "Prépare une liste de 5 activités de 15 minutes pour les moments d’ennui.", "Prepara una lista de 5 actividades de 15 minutos para los momentos de aburrimiento."], ["Deux semaines : tu connais mieux tes déclencheurs. Un éventuel faux pas n’efface pas tout ce chemin.", "Dos semanas: conoces mejor tus desencadenantes. Un posible tropiezo no borra todo este camino.", "Relis tes notes des deux semaines et souligne ce qui t’a le plus aidé(e).", "Relee tus notas de las dos semanas y subraya lo que más te ha ayudado."], ["Remplacer vaut mieux que seulement supprimer : le vide rappelle l’ancienne habitude.", "Sustituir es mejor que solo eliminar: el vacío reclama el viejo hábito.", "Choisis une nouvelle habitude de 10 minutes (lecture, étirements, musique) et pratique-la à l’heure à risque.", "Elige un nuevo hábito de 10 minutos (lectura, estiramientos, música) y practícalo a la hora de riesgo."], ["Ton estime de toi se reconstruit par de petites promesses tenues, pas par de grandes résolutions.", "Tu autoestima se reconstruye con pequeñas promesas cumplidas, no con grandes resoluciones.", "Fais une chose que tu repoussais depuis longtemps (appel, rangement, démarche) et coche-la.", "Haz algo que llevabas tiempo posponiendo (llamada, orden, trámite) y táchalo."], ["Une alimentation régulière stabilise l’humeur. Évite de sauter des repas : la faim aggrave les envies.", "Una alimentación regular estabiliza el ánimo. Evita saltarte comidas: el hambre agrava las ganas.", "Prépare un repas simple et équilibré et mange-le sans écran.", "Prepara una comida sencilla y equilibrada y cómela sin pantallas."], ["La gratitude déplace l’attention du manque vers ce qui existe déjà. C’est un entraînement, pas de la naïveté.", "La gratitud desplaza la atención de lo que falta hacia lo que ya existe. Es un entrenamiento, no ingenuidad.", "Écris 3 choses positives de ta journée et pourquoi elles ont compté.", "Escribe 3 cosas positivas de tu día y por qué han importado."], ["Les relations qui te font du bien te protègent. Choisis avec soin les personnes que tu fréquentes.", "Las relaciones que te hacen bien te protegen. Elige con cuidado a las personas con quienes te rodeas.", "Propose à quelqu’un une activité sans consommation (café, marche, jeu).", "Propón a alguien una actividad sin consumo (café, paseo, juego)."], ["Le stress s’accumule dans le corps. Relâcher les muscles relâche aussi l’esprit.", "El estrés se acumula en el cuerpo. Relajar los músculos también relaja la mente.", "Fais une relaxation musculaire : contracte puis relâche chaque groupe de muscles, des pieds à la tête.", "Haz una relajación muscular: contrae y suelta cada grupo de músculos, de los pies a la cabeza."], ["Trois semaines : une nouvelle routine s’installe. Protège-la comme un rendez-vous important.", "Tres semanas: una nueva rutina se instala. Protégela como una cita importante.", "Écris ta routine idéale du matin et du soir, puis applique-la dès aujourd’hui.", "Escribe tu rutina ideal de mañana y de noche, y empieza a aplicarla hoy mismo."], ["Les situations à risque reviendront (fêtes, disputes, fatigue). Un plan écrit à l’avance vaut mieux que l’improvisation.", "Las situaciones de riesgo volverán (fiestas, discusiones, cansancio). Un plan escrito de antemano vale más que improvisar.", "Rédige ton plan d’urgence : 3 actions et 2 personnes à contacter si l’envie devient trop forte.", "Redacta tu plan de emergencia: 3 acciones y 2 personas a las que contactar si las ganas se vuelven demasiado fuertes."], ["Savoir dire non s’apprend. Une phrase simple et ferme suffit, sans avoir à te justifier.", "Saber decir no se aprende. Una frase sencilla y firme basta, sin necesidad de justificarte.", "Prépare à voix haute une phrase pour refuser une proposition de consommer.", "Prepara en voz alta una frase para rechazar una propuesta de consumir."], ["Le temps retrouvé et l’argent économisé sont des preuves concrètes de ton progrès.", "El tiempo recuperado y el dinero ahorrado son pruebas concretas de tu progreso.", "Calcule ce que tu as économisé depuis le début et choisis un projet qui te fait envie.", "Calcula lo que has ahorrado desde el principio y elige un proyecto que te ilusione."], ["Le plaisir sain existe : créer, jouer, cuisiner, apprendre. Réapprends à t’amuser sans substance.", "El placer sano existe: crear, jugar, cocinar, aprender. Reaprende a divertirte sin sustancias.", "Consacre une heure à une activité créative ou ludique, sans objectif de performance.", "Dedica una hora a una actividad creativa o lúdica, sin objetivo de rendimiento."], ["Tes pensées ne sont pas des faits. Face à « je n’y arriverai jamais », cherche une phrase plus juste.", "Tus pensamientos no son hechos. Ante «nunca lo conseguiré», busca una frase más justa.", "Note une pensée négative récurrente et réécris-la de façon réaliste et bienveillante.", "Anota un pensamiento negativo recurrente y reescríbelo de forma realista y amable."], ["Demander de l’aide est une force. Un(e) professionnel(le) peut t’accompagner là où l’effort seul ne suffit pas.", "Pedir ayuda es una fortaleza. Un/a profesional puede acompañarte donde el esfuerzo solo no basta.", "Parle à l’agent IA ou réserve une séance avec un thérapeute pour faire le point.", "Habla con el agente de IA o reserva una sesión con un terapeuta para hacer balance."], ["Un mois : tu as prouvé que tu peux tenir. Le chemin continue, un jour à la fois, avec les outils que tu as construits.", "Un mes: has demostrado que puedes aguantar. El camino continúa, un día a la vez, con las herramientas que has construido.", "Écris une lettre à toi-même d’il y a un mois, puis fixe ton prochain objectif.", "Escribe una carta a tu yo de hace un mes y fija tu próximo objetivo."]];
const L2=(f,e)=>S.lang=='es'?e:f;
let landing=true;
function rot(a,k){const n=a.length,s=(days()*k)%n;return Array.from({length:Math.min(k,n)},(_,i)=>a[(s+i)%n])}
function planDay(){const p=PLAN[days()%PLAN.length];return S.lang=='es'?[p[1],p[1],p[3]]:[p[0],p[0],p[2]]}
function dayLabel(){const n=days(),c=Math.floor(n/PLAN.length)+1,w=new Date(today()+'T12:00:00Z').toLocaleDateString(S.lang=='es'?'es-ES':'fr-FR',{weekday:'long',timeZone:'UTC'});return L2('Jour ','Día ')+(n%PLAN.length+1)+'/'+PLAN.length+(c>1?' \u00b7 '+L2('cycle ','ciclo ')+c:'')+' \u00b7 '+w}
function dailyAdvice(){return `<div class="card"><h2>\ud83d\udca1 ${L2('Conseil du jour','Consejo del día')}</h2><p class="mu">${esc(dayLabel())}</p><div class="msg" style="margin:8px 0">${esc(planDay()[0])}</div><p class="mu">${L2('Ta tâche du jour t’attend dans l’onglet Parcours (+3 pts).','Tu tarea del día te espera en la pestaña Camino (+3 pts).')}</p></div>`}
function lp(){return `<div class="lp"><div class="lpi"><img class="hero" src="${HERO}" alt="CAP Sobriété &amp; Sérénité" decoding="async"><button class="lpb" onclick="enter()">${L2('Commencer le voyage','Iniciar el viaje')}</button><p class="lpt">${L2('Un pas à la fois. Ton horizon commence ici.','Un paso a la vez. Tu horizonte empieza aquí.')}</p><div class="lpl"><button class="${S.lang=='fr'?'on':''}" onclick="lgl('fr')">Français 🇫🇷</button><button class="${S.lang=='es'?'on':''}" onclick="lgl('es')">Español 🇪🇸</button></div></div></div>`}
function enter(){landing=false;render();scrollTo(0,0)}
function lgl(v){S.lang=v;save();render()}

render();
</script></body></html>
